[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regression-studio"
version = "1.1.0"
description = "Desktop regression analysis tool: enter data, fit models, inspect statistics and plots."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["regression", "statistics", "pyqt6", "data-analysis", "gui"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "PyQt6>=6.5",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "scipy>=1.10"]

[project.scripts]
regression-studio = "regression_studio.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
